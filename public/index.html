<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI/ML Interview — Practice Technical Interviews with Voice AI</title>
<meta name="description" content="Practice AI and machine learning technical interviews with a voice-powered AI interviewer. Choose your difficulty level and get real-time feedback." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-deepest: #06060b;
    --bg-deep: #0a0a12;
    --bg-base: #0f0f1a;
    --bg-card: rgba(18, 18, 32, 0.65);
    --bg-card-hover: rgba(26, 26, 48, 0.75);
    --bg-glass: rgba(255, 255, 255, 0.04);
    --border: rgba(255, 255, 255, 0.07);
    --border-hover: rgba(255, 255, 255, 0.14);
    --text-primary: #e8e8f0;
    --text-secondary: rgba(232, 232, 240, 0.55);
    --text-muted: rgba(232, 232, 240, 0.35);
    --accent-1: #6366f1; /* indigo */
    --accent-2: #22d3ee; /* cyan */
    --accent-gradient: linear-gradient(135deg, #6366f1, #8b5cf6, #22d3ee);
    --accent-gradient-soft: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(34,211,238,0.10));
    --accent-glow: rgba(99, 102, 241, 0.25);
    --danger: #f43f5e;
    --success: #34d399;
    --warning: #fbbf24;
    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 24px;
    --radius-pill: 999px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg-deepest);
    color: var(--text-primary);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ── Animated background mesh ─────────────────────────────── */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 10% 20%, rgba(99,102,241,0.08) 0%, transparent 70%),
      radial-gradient(ellipse 60% 50% at 85% 75%, rgba(34,211,238,0.06) 0%, transparent 70%),
      radial-gradient(ellipse 50% 40% at 50% 50%, rgba(139,92,246,0.04) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
    animation: meshDrift 20s ease-in-out infinite alternate;
  }
  @keyframes meshDrift {
    0%   { opacity: 1; transform: scale(1); }
    100% { opacity: 0.7; transform: scale(1.05) translate(2%, -1%); }
  }

  /* ── Grid overlay ─────────────────────────────────────────── */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 64px 64px;
    pointer-events: none;
    z-index: 0;
  }

  header, main, footer { position: relative; z-index: 1; }

  /* ── Header ───────────────────────────────────────────────── */
  header {
    padding: 18px 28px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-icon {
    width: 34px;
    height: 34px;
    border-radius: var(--radius-sm);
    background: var(--accent-gradient);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 800;
    color: white;
  }
  .brand-text {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.3px;
    color: var(--text-primary);
  }
  .brand-text span {
    background: var(--accent-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  main { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  /* ── Steps ────────────────────────────────────────────────── */
  .step {
    display: none;
    flex: 1;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 36px;
    padding: 24px 24px 60px;
    overflow-y: auto;
  }
  @keyframes stepIn {
    from { opacity: 0; transform: translateY(20px) scale(0.98); }
    to   { opacity: 1; transform: none; }
  }
  body[data-step="1"] #step1 { display: flex; animation: stepIn 0.5s cubic-bezier(0.22, 1, 0.36, 1); }
  body[data-step="2"] #step2 { display: flex; animation: stepIn 0.5s cubic-bezier(0.22, 1, 0.36, 1); }

  .step-title {
    font-weight: 800;
    font-size: clamp(32px, 5vw, 52px);
    letter-spacing: -1.5px;
    line-height: 1.05;
    text-align: center;
    background: linear-gradient(135deg, var(--text-primary) 40%, var(--accent-2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .step-sub {
    color: var(--text-secondary);
    font-size: 16px;
    font-weight: 500;
    text-align: center;
    margin-top: -20px;
    max-width: 480px;
  }

  /* ── Section labels ───────────────────────────────────────── */
  .section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: -20px;
  }

  /* ── Difficulty cards ─────────────────────────────────────── */
  .card-row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 900px;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: scale(0.88) translateY(14px); }
    to   { opacity: 1; transform: none; }
  }
  .diff-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: var(--radius-lg);
    padding: 32px 28px 28px;
    cursor: pointer;
    min-width: 220px;
    max-width: 270px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    animation: cardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
    position: relative;
    overflow: hidden;
  }
  .diff-card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: var(--radius-lg);
    padding: 1px;
    background: var(--accent-gradient);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .diff-card:hover::before, .diff-card.selected::before { opacity: 1; }
  .diff-card:hover {
    transform: translateY(-6px);
    border-color: transparent;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3), 0 0 60px var(--accent-glow);
  }
  .diff-card:active { transform: translateY(-2px) scale(0.98); }
  .diff-card.selected {
    border-color: transparent;
    box-shadow: 0 12px 30px rgba(0,0,0,0.3), 0 0 40px var(--accent-glow);
  }
  .diff-icon {
    width: 44px;
    height: 44px;
    border-radius: var(--radius-sm);
    background: var(--accent-gradient-soft);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    margin-bottom: 4px;
  }
  .diff-title {
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -0.5px;
  }
  .diff-desc {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.5;
  }

  /* ── Voice cards ──────────────────────────────────────────── */
  .voice-row {
    display: flex;
    gap: 14px;
    justify-content: center;
  }
  .voice-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: var(--radius-md);
    padding: 18px 24px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    animation: cardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
    min-width: 180px;
  }
  .voice-card:hover {
    transform: translateY(-3px);
    border-color: var(--border-hover);
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  }
  .voice-card.selected {
    border-color: var(--accent-1);
    box-shadow: 0 0 20px rgba(99,102,241,0.15);
  }
  .voice-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--accent-gradient);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 16px;
    color: white;
    flex-shrink: 0;
  }
  .voice-info { display: flex; flex-direction: column; gap: 2px; }
  .voice-name { font-weight: 600; font-size: 15px; }
  .voice-desc { font-size: 12px; color: var(--text-secondary); }
  .voice-tag {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--accent-2);
    background: rgba(34,211,238,0.1);
    padding: 2px 8px;
    border-radius: var(--radius-pill);
    margin-top: 2px;
    display: inline-block;
    width: fit-content;
  }

  /* ── Name input ───────────────────────────────────────────── */
  .name-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #nameInput {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: var(--radius-pill);
    padding: 12px 20px;
    font-size: 14px;
    font-family: inherit;
    width: 280px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  #nameInput:focus {
    outline: none;
    border-color: var(--accent-1);
    box-shadow: 0 0 20px rgba(99,102,241,0.12);
  }
  #nameInput::placeholder { color: var(--text-muted); }

  /* ── Start button ─────────────────────────────────────────── */
  #startBtn {
    background: var(--accent-gradient);
    border: none;
    color: white;
    font-family: inherit;
    font-weight: 700;
    font-size: 16px;
    padding: 14px 40px;
    border-radius: var(--radius-pill);
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    box-shadow: 0 4px 20px var(--accent-glow);
    letter-spacing: -0.3px;
  }
  #startBtn:hover:not(:disabled) {
    transform: translateY(-3px);
    box-shadow: 0 8px 30px var(--accent-glow);
  }
  #startBtn:active:not(:disabled) { transform: translateY(-1px) scale(0.98); }
  #startBtn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    box-shadow: none;
  }

  /* ── Step 2: Interview session ────────────────────────────── */
  #step2 { justify-content: flex-start; gap: 0; padding: 0; overflow: hidden; }

  #sessionBar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 6px 24px 14px;
    flex-wrap: wrap;
  }
  .session-pill {
    font-weight: 600;
    font-size: 13px;
    color: var(--text-primary);
    background: var(--bg-card);
    border: 1px solid var(--border);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: var(--radius-pill);
    padding: 8px 18px;
    cursor: default;
  }
  .session-action {
    font-weight: 600;
    font-size: 13px;
    color: var(--text-secondary);
    background: none;
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    padding: 8px 16px;
    cursor: pointer;
    font-family: inherit;
    transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .session-action:hover {
    color: var(--text-primary);
    border-color: var(--border-hover);
    background: var(--bg-glass);
  }

  /* Dropdowns */
  .dd { position: relative; }
  .dd-btn { border: none; cursor: pointer; font-family: inherit; }
  .dd-btn .caret { font-size: 10px; margin-left: 4px; opacity: 0.5; }
  .dd-menu {
    position: absolute;
    top: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg-base);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 6px;
    min-width: 210px;
    display: none;
    z-index: 40;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .dd.open .dd-menu { display: block; animation: cardIn 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .dd-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    text-align: left;
    transition: background 0.12s ease;
  }
  .dd-item:hover { background: var(--bg-glass); }
  .dd-item .swatch {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex: none;
  }
  .dd-item .sub { font-weight: 400; font-size: 11px; color: var(--text-muted); }
  .dd-item .check { margin-left: auto; font-size: 12px; color: var(--accent-2); }

  /* ── Console ──────────────────────────────────────────────── */
  #console {
    flex: 1;
    min-height: 0;
    width: 100%;
    max-width: min(1100px, 94vw);
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    flex-direction: column;
  }
  #consoleInner {
    flex: 1;
    min-height: 0;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  /* Animated gradient border */
  #consoleInner::before {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: var(--radius-lg);
    padding: 1px;
    background: linear-gradient(135deg, var(--accent-1), transparent 40%, transparent 60%, var(--accent-2));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: 0.3;
    animation: borderRotate 8s linear infinite;
    pointer-events: none;
  }
  @keyframes borderRotate {
    0%   { background: linear-gradient(0deg, var(--accent-1), transparent 40%, transparent 60%, var(--accent-2)); }
    25%  { background: linear-gradient(90deg, var(--accent-1), transparent 40%, transparent 60%, var(--accent-2)); }
    50%  { background: linear-gradient(180deg, var(--accent-1), transparent 40%, transparent 60%, var(--accent-2)); }
    75%  { background: linear-gradient(270deg, var(--accent-1), transparent 40%, transparent 60%, var(--accent-2)); }
    100% { background: linear-gradient(360deg, var(--accent-1), transparent 40%, transparent 60%, var(--accent-2)); }
  }

  #consoleBar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    position: relative;
    z-index: 1;
  }
  #consoleBar .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-1);
    animation: livePulse 2.2s ease-in-out infinite;
  }
  @keyframes livePulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  #speakDots {
    display: inline-flex;
    gap: 4px;
    margin-left: 6px;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  #speakDots.on { opacity: 1; }
  #speakDots i {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    animation: dotBounce 0.9s ease-in-out infinite;
  }
  #speakDots i:nth-child(1) { background: var(--accent-1); }
  #speakDots i:nth-child(2) { background: #8b5cf6; animation-delay: 0.15s; }
  #speakDots i:nth-child(3) { background: var(--accent-2); animation-delay: 0.3s; }
  @keyframes dotBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  #callTimer { margin-left: auto; font-weight: 500; font-variant-numeric: tabular-nums; }

  /* ── Transcript ───────────────────────────────────────────── */
  #transcript {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: relative;
    z-index: 1;
  }
  #transcript::-webkit-scrollbar { width: 4px; }
  #transcript::-webkit-scrollbar-track { background: transparent; }
  #transcript::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  @keyframes bubbleIn {
    from { opacity: 0; transform: translateY(10px) scale(0.95); }
    to   { opacity: 1; transform: none; }
  }
  .bubble {
    padding: 12px 16px 14px;
    border-radius: var(--radius-md);
    max-width: 72%;
    line-height: 1.6;
    font-size: 14px;
    animation: bubbleIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .blabel {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 5px;
    opacity: 0.5;
  }
  .user {
    background: rgba(99, 102, 241, 0.12);
    border: 1px solid rgba(99, 102, 241, 0.15);
    color: var(--text-primary);
    align-self: flex-end;
    border-bottom-right-radius: 4px;
    transform-origin: bottom right;
  }
  .agent {
    background: var(--bg-glass);
    border: 1px solid var(--border);
    color: var(--text-primary);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    transform-origin: bottom left;
    position: relative;
    transition: border-color 0.15s ease;
  }
  .bubble.agent.replayable { cursor: pointer; padding-right: 32px; }
  .bubble.agent.replayable:hover { border-color: var(--accent-1); }
  .bubble.agent.replayable::after {
    content: "\21BB";
    position: absolute;
    right: 10px;
    bottom: 8px;
    font-size: 12px;
    opacity: 0.3;
    transition: opacity 0.15s ease;
  }
  .bubble.agent.replayable:hover::after { opacity: 0.8; }
  .bubble.agent.replaying { border-color: var(--accent-2); }
  .bubble.agent.replaying::after { opacity: 1; }
  .interim { opacity: 0.5; font-style: italic; }
  .error {
    background: rgba(244, 63, 94, 0.1);
    border: 1px solid rgba(244, 63, 94, 0.2);
    color: var(--danger);
    align-self: center;
    font-size: 13px;
  }

  /* ── Chips ────────────────────────────────────────────────── */
  #chips {
    display: flex;
    gap: 8px;
    flex-wrap: nowrap;
    justify-content: center;
    max-width: min(1100px, 94vw);
    margin: 0 auto;
    padding: 12px 24px 4px;
    flex-shrink: 0;
    overflow-x: auto;
  }
  #chips::-webkit-scrollbar { display: none; }
  .chip {
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-secondary);
    border-radius: var(--radius-pill);
    padding: 8px 16px;
    font-size: 12px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.14s ease, border-color 0.14s ease, color 0.14s ease, box-shadow 0.14s ease;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .chip:hover {
    transform: translateY(-2px);
    border-color: var(--accent-1);
    color: var(--text-primary);
    box-shadow: 0 4px 16px rgba(99,102,241,0.1);
  }
  .chip:active { transform: translateY(0) scale(0.97); }

  /* ── Footer ───────────────────────────────────────────────── */
  footer {
    display: none;
    padding: 10px 24px 22px;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    position: relative;
    z-index: 1;
  }
  body[data-step="2"] footer { display: flex; }

  .talk-row {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .round-btn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: none;
    background: var(--accent-gradient);
    color: white;
    font-size: 24px;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 20px var(--accent-glow);
  }
  .round-btn:hover { transform: scale(1.08); box-shadow: 0 6px 30px var(--accent-glow); }
  .round-btn:active { transform: scale(0.96); }

  /* Recording state */
  #micBtn .icon-stop { display: none; }
  body.rec #micBtn {
    background: var(--bg-base);
    border: 2px solid var(--danger);
    color: var(--danger);
    animation: pulse 1.2s infinite;

<script>
// AI/ML Interviewer frontend. UI shell + data are new; the LiveKit
// conversation transport is reused verbatim from the original booth demo.

// ===== Difficulty + voice catalog =====
const SCENARIOS = {
  junior: {
    label: "Junior",
    desc: "Fundamentals — bias-variance, gradient descent, basic architectures",
    icon: "📘",
    recommended: "arcade",

    voices: [
      { id: "arcade", name: "Arcade", char: "Frank", desc: "calm and professional" },
      { id: "clara", name: "Clara", char: "Clara", desc: "warm and reliable" },
    ],
  },
  mid: {
    label: "Mid-Level",
    desc: "Intermediate — transformers, regularization, experiment tracking",
    icon: "📙",
    recommended: "arcade",
    chips: ["I'm ready to start", "Can I get a hint?", "Could you repeat that?", "Let's move on", "I'd like to end the interview"],
    voices: [
      { id: "arcade", name: "Arcade", char: "Frank", desc: "calm and professional" },
      { id: "clara", name: "Clara", char: "Clara", desc: "warm and reliable" },
    ],
  },
  senior: {
    label: "Senior",
    desc: "Advanced — system design, scaling pipelines, research discussion",
    icon: "📕",
    recommended: "clara",
    chips: ["I'm ready to start", "Can I get a hint?", "Could you repeat that?", "Let's move on", "I'd like to end the interview"],
    voices: [
      { id: "arcade", name: "Arcade", char: "Frank", desc: "calm and professional" },
      { id: "clara", name: "Clara", char: "Clara", desc: "warm and reliable" },
    ],
  },
};

// ===== DOM =====
const transcriptEl = document.getElementById("transcript");
const micBtn = document.getElementById("micBtn");
const stateTextEl = document.getElementById("stateText");
const textInput = document.getElementById("textInput");
const sendBtn = document.getElementById("sendBtn");
const chipsEl = document.getElementById("chips");
const diffRow = document.getElementById("diffRow");
const voiceRow = document.getElementById("voiceRow");
const diffPill = document.getElementById("diffPill");
const speakDotsEl = document.getElementById("speakDots");
const nameInput = document.getElementById("nameInput");
const startBtn = document.getElementById("startBtn");
const callTimerEl = document.getElementById("callTimer");

let currentDifficulty = null;
let currentVoice = null;
let callTimerInterval = null;
let callStartTime = null;

// ===== Step navigation =====
function showStep(n) { document.body.dataset.step = String(n); }

// ===== Build Step 1: difficulty cards =====
Object.entries(SCENARIOS).forEach(([key, s], i) => {
  const card = document.createElement("button");
  card.className = "diff-card";
  card.id = "diff-" + key;
  card.style.animationDelay = `${i * 80}ms`;
  card.innerHTML =
    `<div class="diff-icon">${s.icon}</div>` +
    `<div class="diff-title">${s.label}</div>` +
    `<div class="diff-desc">${s.desc}</div>`;
  card.addEventListener("click", () => selectDifficulty(key));
  diffRow.appendChild(card);
});

function selectDifficulty(key) {
  currentDifficulty = key;
  const s = SCENARIOS[key];
  // Highlight selected card
  document.querySelectorAll(".diff-card").forEach(c => c.classList.remove("selected"));
  document.getElementById("diff-" + key).classList.add("selected");
  // Auto-select recommended voice
  if (!currentVoice) selectVoiceCard(s.recommended);
  // Build voice row
  buildVoiceRow(key);
  updateStartBtn();
}

function buildVoiceRow(key) {
  const s = SCENARIOS[key];
  voiceRow.innerHTML = "";
  s.voices.forEach((v, i) => {
    const card = document.createElement("button");
    card.className = "voice-card" + (v.id === currentVoice ? " selected" : "");
    card.id = "voice-" + v.id;
    card.style.animationDelay = `${i * 70}ms`;
    card.innerHTML =
      `<div class="voice-avatar">${v.char[0]}</div>` +
      `<div class="voice-info">` +
        `<div class="voice-name">${v.char}</div>` +
        `<div class="voice-desc">${v.desc}</div>` +
        (v.id === s.recommended ? `<div class="voice-tag">Recommended</div>` : "") +
      `</div>`;
    card.addEventListener("click", () => selectVoiceCard(v.id));
    voiceRow.appendChild(card);
  });
}

function selectVoiceCard(voiceId) {
  currentVoice = voiceId;
  document.querySelectorAll(".voice-card").forEach(c => c.classList.remove("selected"));
  const el = document.getElementById("voice-" + voiceId);
  if (el) el.classList.add("selected");
  updateStartBtn();
}

function updateStartBtn() {
  startBtn.disabled = !currentDifficulty || !currentVoice;
}

// Auto-select Mid-Level difficulty on page load (enables the Start button)
selectDifficulty("mid");

startBtn.addEventListener("click", () => {
  if (!currentDifficulty || !currentVoice) return;
  enterSession();
});

function enterSession() {
  const s = SCENARIOS[currentDifficulty];
  diffPill.innerHTML = `${s.icon} ${s.label} <span class="caret">&#9662;</span>`;
  document.getElementById("consoleTitle").textContent = `AI/ML Interview · ${s.label}`;
  // Build chips
  chipsEl.innerHTML = "";
  for (const c of s.chips) {
    const chip = document.createElement("button");
    chip.className = "chip";
    chip.textContent = c;
    chip.addEventListener("click", () => sendUserText(c));
    chipsEl.appendChild(chip);
  }
  showStep(2);
  beginCall();
}

document.getElementById("startOver").addEventListener("click", () => { endCall(); showStep(1); });

// ===== Dropdowns (difficulty + voice switchers) =====
const diffDD = document.getElementById("diffDD");
const voiceDD = document.getElementById("voiceDD");
const diffMenu = document.getElementById("diffMenu");
const voiceMenu = document.getElementById("voiceMenu");

function closeDropdowns() { diffDD.classList.remove("open"); voiceDD.classList.remove("open"); }

function buildDiffMenu() {
  diffMenu.innerHTML = "";
  Object.entries(SCENARIOS).forEach(([key, s]) => {
    const item = document.createElement("button");
    item.className = "dd-item";
    item.innerHTML = `<span class="swatch" style="background:var(--accent-1)"></span><span>${s.icon} ${s.label}</span>` +
      (key === currentDifficulty ? `<span class="check">&#10003;</span>` : "");
    item.addEventListener("click", (e) => {
      e.stopPropagation(); closeDropdowns();
      if (key === currentDifficulty) return;
      currentDifficulty = key;
      currentVoice = SCENARIOS[key].recommended;
      enterSession();
    });
    diffMenu.appendChild(item);
  });
}

function buildVoiceMenu() {
  voiceMenu.innerHTML = "";
  const s = SCENARIOS[currentDifficulty];
  s.voices.forEach((v) => {
    const item = document.createElement("button");
    item.className = "dd-item";
    item.innerHTML = `<span class="swatch" style="background:var(--accent-2)"></span><span>${v.char} <span class="sub">${v.desc}</span></span>` +
      (v.id === currentVoice ? `<span class="check">&#10003;</span>` : "");
    item.addEventListener("click", (e) => {
      e.stopPropagation(); closeDropdowns();
      if (v.id === currentVoice) return;
      currentVoice = v.id;
      enterSession();
    });
    voiceMenu.appendChild(item);
  });
}

diffPill.addEventListener("click", (e) => {
  e.stopPropagation();
  const wasOpen = diffDD.classList.contains("open");
  closeDropdowns();
  if (!wasOpen) { buildDiffMenu(); diffDD.classList.add("open"); }
});
document.getElementById("changeVoice").addEventListener("click", (e) => {
  e.stopPropagation();
  const wasOpen = voiceDD.classList.contains("open");
  closeDropdowns();
  if (!wasOpen) { buildVoiceMenu(); voiceDD.classList.add("open"); }
});
document.addEventListener("click", closeDropdowns);

function voiceCharName() {
  const s = SCENARIOS[currentDifficulty];
  if (!s) return "Interviewer";
  const v = s.voices.find(x => x.id === currentVoice);
  return v ? v.char : "Interviewer";
}

// Strip expressive tokens and stress markers from the visible caption
function displayText(text) {
  return (text || "").replace(/<[^<>]+>/g, "").replace(/\*/g, "").replace(/\s{2,}/g, " ").trim();
}

function addBubble(cls, text) {
  const div = document.createElement("div");
  div.className = "bubble " + cls;
  const label = document.createElement("div");
  label.className = "blabel";
  label.textContent = cls.startsWith("agent") ? `${voiceCharName().toUpperCase()} · INTERVIEWER` : "YOU · CANDIDATE";
  if (cls.startsWith("agent") || cls.startsWith("user")) div.appendChild(label);
  const body = document.createElement("div");
  body.textContent = cls.startsWith("agent") ? displayText(text) : text;
  div.appendChild(body);
  transcriptEl.appendChild(div);
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
  return div;
}

function setStatus(text) { stateTextEl.textContent = text; }
function setSpeaking(on) {
  document.body.classList.toggle("talking", on);
  speakDotsEl.classList.toggle("on", on);
}

// ===== Call timer =====
function startCallTimer() {
  callStartTime = Date.now();
  callTimerEl.textContent = "00:00";
  callTimerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
    const mins = String(Math.floor(elapsed / 60)).padStart(2, "0");
    const secs = String(elapsed % 60).padStart(2, "0");
    callTimerEl.textContent = `${mins}:${secs}`;
  }, 1000);
}
function stopCallTimer() {
  if (callTimerInterval) { clearInterval(callTimerInterval); callTimerInterval = null; }
  callTimerEl.textContent = "00:00";
}

// ===== LiveKit engine (push-to-talk) =====
// This entire section is reused verbatim from the original booth demo.
const { Room, RoomEvent, Track } = LivekitClient;
let room = null;
let talking = false;
let agentIdentity = null;
const segBubbles = new Map();

// ===== Replay: capture the agent's live audio =====
let recorder = null;
let recChunks = [];
let recStream = null;
let curTurn = null;
let turnEndTimer = null;
let replayCtx = null;
let replaySource = null;
let replayingBubble = null;
let replayQueue = [];

function startRecorder(track) {
  stopRecorder();
  try {
    recStream = new MediaStream([track.mediaStreamTrack]);
    spinUpRecorder();
  } catch (_) {
    recorder = null;
  }
}

function spinUpRecorder() {
  if (!recStream) return;
  try {
    const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : "";
    recorder = new MediaRecorder(recStream, mime ? { mimeType: mime } : undefined);
    recChunks = [];
    recorder.ondataavailable = (e) => { if (e.data && e.data.size) recChunks.push(e.data); };
    recorder.start(250);
  } catch (_) {
    recorder = null;
  }
}

function stopRecorder() {
  if (recorder) {
    recorder.ondataavailable = null;
    recorder.onstop = null;
    try { if (recorder.state !== "inactive") recorder.stop(); } catch (_) {}
  }
  recorder = null;
  recChunks = [];
  recStream = null;
  clearTimeout(turnEndTimer);
  turnEndTimer = null;
  curTurn = null;
}

function restartIdleRecorder() {
  if (!recStream || curTurn || turnEndTimer) return;
  if (recorder) {
    recorder.ondataavailable = null;
    recorder.onstop = null;
    try { if (recorder.state !== "inactive") recorder.stop(); } catch (_) {}
  }
  spinUpRecorder();
}

function onAgentSpeakingChange(speaking) {
  if (!recorder) return;
  if (speaking) {
    if (turnEndTimer) { clearTimeout(turnEndTimer); turnEndTimer = null; return; }
    if (!curTurn) {
      curTurn = { bubbles: new Set() };
      const orphans = transcriptEl.querySelectorAll(".bubble.agent:not(.replayable)");
      if (orphans.length) curTurn.bubbles.add(orphans[orphans.length - 1]);
    }
  } else if (curTurn && !turnEndTimer) {
    turnEndTimer = setTimeout(finalizeTurn, 1000);
  }
}

function finalizeTurn() {
  turnEndTimer = null;
  const turn = curTurn;
  curTurn = null;
  if (!turn || !recorder || recorder.state === "inactive") return;
  let targets = [...turn.bubbles];
  if (!targets.length) {
    const all = transcriptEl.querySelectorAll(".bubble.agent");
    if (all.length) targets = [all[all.length - 1]];
  }
  const rec = recorder;
  rec.onstop = () => {
    const blob = new Blob(recChunks, { type: (recChunks[0] && recChunks[0].type) || "audio/webm" });
    if (blob.size) for (const bubble of targets) makeReplayable(bubble, blob);
    spinUpRecorder();
  };
  try { rec.stop(); } catch (_) { spinUpRecorder(); }
}

function makeReplayable(bubble, blob) {
  if (!bubble || !bubble.isConnected) return;
  if (!bubble._blobs) bubble._blobs = [];
  bubble._blobs.push(blob);
  bubble.classList.add("replayable");
  bubble.title = "Tap to hear this again";
  bubble.onclick = () => {
    if (document.body.classList.contains("talking")) return;
    if (talking) return;
    replayBubble(bubble);
  };
}

function stopReplay() {
  replayQueue = [];
  if (replaySource) {
    replaySource.onended = null;
    try { replaySource.stop(); } catch (_) {}
    replaySource = null;
  }
  if (replayingBubble) { replayingBubble.classList.remove("replaying"); replayingBubble = null; }
}

function replayBubble(bubble) {
  stopReplay();
  if (!bubble._blobs || !bubble._blobs.length) return;
  replayingBubble = bubble;
  bubble.classList.add("replaying");
  setStatus("Replaying…");
  replayQueue = bubble._blobs.slice();
  playNextReplayBlob();
}

function findSpeechBounds(ch, sampleRate) {
  const hop = Math.floor(sampleRate / 100);
  const rmsAt = (i) => {
    let sum = 0;
    const end = Math.min(i + hop, ch.length);
    for (let j = i; j < end; j++) sum += ch[j] * ch[j];
    return Math.sqrt(sum / Math.max(1, end - i));
  };
  let first = -1;
  for (let i = 0; i < ch.length; i += hop) { if (rmsAt(i) > 0.01) { first = i; break; } }
  if (first < 0) return null;
  let last = first;
  for (let i = ch.length - hop; i >= first; i -= hop) { if (rmsAt(i) > 0.01) { last = Math.min(ch.length, i + hop); break; } }
  return { first, last };
}

async function playNextReplayBlob() {
  const blob = replayQueue.shift();
  if (!blob) {
    stopReplay();
    setStatus(talking ? "Listening… tap the mic to send" : "Tap the mic to talk");
    return;
  }
  try {
    if (!replayCtx) replayCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (replayCtx.state === "suspended") await replayCtx.resume();
    const buf = await replayCtx.decodeAudioData(await blob.arrayBuffer());
    const bounds = findSpeechBounds(buf.getChannelData(0), buf.sampleRate);
    if (!bounds) { playNextReplayBlob(); return; }
    const startSec = Math.max(0, bounds.first / buf.sampleRate - 0.15);
    const durSec = Math.min(buf.duration, bounds.last / buf.sampleRate + 0.25) - startSec;
    const src = replayCtx.createBufferSource();
    src.buffer = buf;
    src.connect(replayCtx.destination);
    replaySource = src;
    src.onended = () => {
      if (replaySource !== src) return;
      replaySource = null;
      playNextReplayBlob();
    };
    src.start(0, startSec, durSec);
  } catch (_) {
    playNextReplayBlob();
  }
}

function wireRoom(r) {
  r.on(RoomEvent.TrackSubscribed, (track, pub, participant) => {
    if (participant) agentIdentity = participant.identity;
    if (track.kind === Track.Kind.Audio) {
      const el = track.attach();
      el.autoplay = true;
      el.style.display = "none";
      document.body.appendChild(el);
      if (track.receiver && "jitterBufferTarget" in track.receiver) {
        try { track.receiver.jitterBufferTarget = 150; } catch (_) {}
      }
      startRecorder(track);
    }
  });
  r.on(RoomEvent.ParticipantConnected, (p) => { agentIdentity = p.identity; });
  r.on(RoomEvent.TrackUnsubscribed, (track) => {
    stopRecorder();
    track.detach().forEach((el) => el.remove());
  });
  r.on(RoomEvent.ActiveSpeakersChanged, (speakers) => {
    const agentSpeaking = speakers.some((p) => p.identity !== r.localParticipant.identity);
    setSpeaking(agentSpeaking);
    if (agentSpeaking) stopReplay();
    onAgentSpeakingChange(agentSpeaking);
    if (agentSpeaking) setStatus(voiceCharName() + " is speaking…");
    else if (!talking) setStatus("Tap the mic to talk");
  });
  r.on(RoomEvent.TranscriptionReceived, (segments, participant) => {
    const isAgent = participant && participant.identity !== r.localParticipant.identity;
    for (const seg of segments) {
      const cls = isAgent ? "agent" : "user";
      let bubble = segBubbles.get(seg.id);
      if (!bubble) { bubble = addBubble(cls, seg.text); segBubbles.set(seg.id, bubble); }
      else { bubble.lastChild.textContent = isAgent ? displayText(seg.text) : seg.text; }
      if (isAgent && curTurn) curTurn.bubbles.add(bubble);
      transcriptEl.scrollTop = transcriptEl.scrollHeight;
    }
  });
  r.on(RoomEvent.Connected, () => setStatus("Tap the mic to talk"));
  r.on(RoomEvent.Disconnected, () => { setSpeaking(false); });
  r.on(RoomEvent.Reconnecting, () => setStatus("Connection hiccup — reconnecting…"));
  r.on(RoomEvent.Reconnected, () => setStatus(talking ? "Listening… tap the mic to send" : "Tap the mic to talk"));
  r.on(RoomEvent.ConnectionQualityChanged, (quality, participant) => {
    if (participant !== r.localParticipant) return;
    const bad = quality === "poor" || quality === "lost";
    if (bad && !talking && !document.body.classList.contains("talking")) {
      setStatus("Connection is struggling — replies may take a moment…");
    }
  });
}

async function callAgent(method) {
  if (!room || !agentIdentity) return;
  try {
    await room.localParticipant.performRpc({ destinationIdentity: agentIdentity, method, payload: "" });
  } catch (err) { console.error("rpc", method, err); }
}

async function beginCall() {
  await endCall();
  talking = false;
  document.body.classList.remove("rec");
  setStatus("Connecting…");
  try {
    const candidateName = nameInput.value.trim() || undefined;
    const resp = await fetch("/api/token", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ difficulty: currentDifficulty, voice: currentVoice, name: candidateName }),
    });
    if (!resp.ok) throw new Error("token request failed (" + resp.status + ")");
    const { serverUrl, token } = await resp.json();
    room = new Room({ adaptiveStream: true, dynacast: true });
    wireRoom(room);
    await room.connect(serverUrl, token);
    await room.localParticipant.setMicrophoneEnabled(true);
    await room.localParticipant.setMicrophoneEnabled(false);
    startCallTimer();
  } catch (err) {
    console.error(err);
    setStatus("Couldn't start the call. Tap Start over to retry.");
    addBubble("error", "Connection failed: " + (err.message || err));
  }
}

async function endCall() {
  setSpeaking(false);
  stopReplay();
  stopRecorder();
  stopCallTimer();
  segBubbles.clear();
  talking = false;
  document.body.classList.remove("rec");
  if (room) { try { await room.disconnect(); } catch (e) {} room = null; }
  agentIdentity = null;
  if (transcriptEl) transcriptEl.innerHTML = "";
}

async function cancelTurn() {
  if (!talking) return;
  talking = false;
  document.body.classList.remove("rec");
  if (room) await room.localParticipant.setMicrophoneEnabled(false);
  await callAgent("cancel_turn");
}

async function sendUserText(text) {
  text = (text || "").trim();
  if (!text || !room) return;
  stopReplay();
  await cancelTurn();
  restartIdleRecorder();
  addBubble("user", text);
  try { 
    await room.localParticipant.sendText(text, { topic: "lk.chat" }); 
    // Trigger the agent to reply to the text since it's waiting for manual turn commits
    setTimeout(() => {
      setStatus(voiceCharName() + " is thinking…");
      callAgent("end_turn");
    }, 150);
  }
  catch (err) { console.error("sendText failed", err); }
}

micBtn.addEventListener("click", async () => {
  if (!room) return;
  if (!talking) {
    stopReplay();
    talking = true;
    document.body.classList.add("rec");
    setStatus("Listening… tap the mic to send");
    await room.localParticipant.setMicrophoneEnabled(true);
    await callAgent("start_turn");
  } else {
    talking = false;
    document.body.classList.remove("rec");
    setStatus(voiceCharName() + " is thinking…");
    await room.localParticipant.setMicrophoneEnabled(false);
    restartIdleRecorder();
    await callAgent("end_turn");
  }
});

sendBtn.addEventListener("click", () => { sendUserText(textInput.value); textInput.value = ""; });
textInput.addEventListener("keydown", (e) => { if (e.key === "Enter") { sendUserText(textInput.value); textInput.value = ""; } });

showStep(1);
</script>
